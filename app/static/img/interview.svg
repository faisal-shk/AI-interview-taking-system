<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34a853;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" />
  
  <!-- Desk -->
  <rect x="100" y="400" width="600" height="20" rx="5" fill="#6c757d" />
  <rect x="150" y="420" width="20" height="80" fill="#6c757d" />
  <rect x="630" y="420" width="20" height="80" fill="#6c757d" />
  
  <!-- Laptop -->
  <rect x="300" y="320" width="200" height="10" rx="5" fill="#343a40" />
  <rect x="300" y="250" width="200" height="70" rx="5" fill="#343a40" />
  <rect x="310" y="260" width="180" height="50" rx="2" fill="#fff" />
  
  <!-- Screen Content -->
  <rect x="320" y="270" width="160" height="10" rx="2" fill="#e9ecef" />
  <rect x="320" y="285" width="100" height="5" rx="2" fill="#e9ecef" />
  <rect x="320" y="295" width="80" height="5" rx="2" fill="#e9ecef" />
  
  <!-- Interviewer -->
  <circle cx="190" cy="220" r="50" fill="#dee2e6" />
  <rect x="170" y="270" width="40" height="100" rx="5" fill="#6610f2" />
  <rect x="160" y="300" width="20" height="60" rx="5" fill="#6610f2" />
  <rect x="200" y="300" width="20" height="60" rx="5" fill="#6610f2" />
  
  <!-- Candidate -->
  <circle cx="600" cy="220" r="50" fill="#dee2e6" />
  <rect x="580" y="270" width="40" height="100" rx="5" fill="#fd7e14" />
  <rect x="570" y="300" width="20" height="60" rx="5" fill="#fd7e14" />
  <rect x="610" y="300" width="20" height="60" rx="5" fill="#fd7e14" />
  
  <!-- Speech Bubbles -->
  <ellipse cx="250" cy="180" rx="60" ry="40" fill="#fff" stroke="#000" stroke-width="2" />
  <ellipse cx="540" cy="180" rx="60" ry="40" fill="#fff" stroke="#000" stroke-width="2" />
  
  <!-- Speech Bubble Content -->
  <rect x="210" y="175" width="80" height="5" rx="2" fill="#495057" />
  <rect x="210" y="185" width="60" height="5" rx="2" fill="#495057" />
  
  <rect x="500" y="175" width="80" height="5" rx="2" fill="#495057" />
  <rect x="500" y="185" width="60" height="5" rx="2" fill="#495057" />
  
  <!-- Speech Lines -->
  <path d="M 220 215 L 215 250" stroke="#000" stroke-width="2" fill="none" />
  <path d="M 570 215 L 575 250" stroke="#000" stroke-width="2" fill="none" />
  
  <!-- AI Elements -->
  <circle cx="400" cy="120" r="40" fill="url(#grad1)" />
  <path d="M 380 120 L 420 120 M 400 100 L 400 140" stroke="#fff" stroke-width="6" stroke-linecap="round" />
  
  <!-- Connection Lines -->
  <path d="M 400 160 L 400 220 L 250 220" stroke="#000" stroke-width="2" stroke-dasharray="5,5" fill="none" />
  <path d="M 400 160 L 400 220 L 540 220" stroke="#000" stroke-width="2" stroke-dasharray="5,5" fill="none" />
  
  <!-- Decorative Elements -->
  <circle cx="150" cy="450" r="10" fill="#dc3545" />
  <circle cx="650" cy="450" r="10" fill="#28a745" />
  <rect x="100" y="500" width="600" height="10" rx="5" fill="#f8f9fa" stroke="#dee2e6" />
</svg> 